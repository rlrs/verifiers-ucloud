[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "verifiers-ucloud"
version = "0.3.4"
description = "UCloud sandbox runtime and relay interception for verifiers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "ucloud-sandboxes-sdk[async] @ https://github.com/rlrs/ucloud-sandboxes-sdk/releases/download/v0.4.38/ucloud_sandboxes_sdk-0.4.38-py3-none-any.whl",
    # The rlrs fork: upstream verifiers plus the runtime-provider hooks this package
    # uses and the harnesses LUMI RL trains with.
    "verifiers @ git+https://github.com/rlrs/verifiers@v0.3.1.post1",
]

[project.scripts]
verifiers-ucloud = "verifiers_ucloud.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<9.1",
    "pytest-asyncio>=0.24",
    "ruff>=0.16",
    "ty>=0.0.63",
]

[tool.hatch.build.targets.wheel]
packages = ["src/verifiers_ucloud"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.uv.exclude-newer-package]
prime-pydantic-config = false
prime-sandboxes = false
prime-tunnel = false
renderers = false
